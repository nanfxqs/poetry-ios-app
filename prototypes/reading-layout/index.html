<!doctype html>
<!-- THROWAWAY UI PROTOTYPE. Four reading layouts; ?variant=A|B|C|D. D responds to feedback: no separate hero or imagery behind poem. No production app or persistence. -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>诗词 · 阅读布局草案</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;color:#25332f;background:#eceeea}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ad7249;outline-offset:4px}button{border:0;background:none;color:inherit}main{max-width:1120px;margin:34px auto 110px;padding:0 24px;display:grid;grid-template-columns:1fr 420px;gap:70px;align-items:start}.intro{padding-top:46px}.eyebrow{font-size:11px;letter-spacing:3px;color:#647b70}.intro h1{font-family:serif;font-size:38px;font-weight:500;line-height:1.4;margin:20px 0}.intro p{font-size:15px;line-height:1.9;color:#63706a;max-width:440px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}.choices button{border:1px solid #ccd4cc;padding:10px 13px;border-radius:7px}.choices button[aria-pressed=true]{background:#294e43;color:white;border-color:#294e43}.notes{margin-top:35px;padding-top:20px;border-top:1px solid #ccd4cc;font-size:13px;line-height:1.9;max-width:430px}.notes strong{display:block;font-size:14px;margin-bottom:6px}.notes ul{padding-left:19px}.state{font-family:monospace;font-size:12px;white-space:pre-wrap;color:#64706c;background:#e3e8e1;padding:14px;border-radius:7px;margin-top:24px}.phone{width:100%;max-width:420px;min-height:780px;border:1px solid #c5cec4;border-radius:32px;overflow:hidden;position:relative;background:#f9f8f2;box-shadow:0 20px 50px #20382915}.status{height:37px;display:flex;justify-content:space-between;padding:15px 26px 0;font-size:11px;position:relative;z-index:2}.apphead{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 27px;position:relative;z-index:2}.brand{font-family:serif;font-size:24px;letter-spacing:5px}.day{font-size:11px;color:#728377;letter-spacing:2px}.scene{overflow:hidden;position:relative;background:linear-gradient(180deg,#dce5dc,#f1eee0);height:150px}.scene svg{width:100%;height:100%;display:block}.scene-label{position:absolute;left:24px;bottom:15px;font-size:10px;letter-spacing:3px;color:#697e74}.poem{position:relative;padding:24px 26px 18px}.poem h2{font-family:"Noto Serif CJK SC","Songti SC",serif;font-size:22px;line-height:1.6;font-weight:500;margin:0 0 8px;letter-spacing:1px}.author{font-size:12px;letter-spacing:3px;color:#708476;padding:6px 0}.verses{font-family:"Noto Serif CJK SC","Songti SC",serif;font-size:21px;line-height:2.2;letter-spacing:2px;margin:17px 0}.verses span{display:block;white-space:nowrap}.guide{font-size:12px;color:#728075;line-height:1.8;letter-spacing:.4px;margin:12px 0 0}.actions{display:flex;justify-content:center;gap:20px;margin:14px 25px 18px;padding-top:14px;border-top:1px solid #ccd5c655;font-size:12px}.actions button{padding:9px}.details{margin:0 28px 20px;font-size:12px;color:#718075;line-height:1.9}.details summary{cursor:pointer;padding:8px 0}.details p{padding:10px;background:#eaf0e650}.bottom{display:flex;justify-content:space-around;padding:16px 20px 25px;font-size:12px;border-top:1px solid #ccd5c677;background:#f9f8f2;position:relative}.bottom span{color:#8a948d;padding:4px 10px}.bottom .active{color:#2c5a46}.bottom b{display:block;width:4px;height:4px;border-radius:50%;background:currentColor;margin:7px auto 0}.A .poem{text-align:center}.A .scene{margin:0 20px;border-radius:70px 70px 3px 3px}.A .guide{margin-top:18px}.B{background:#f4f1e6}.B .apphead{height:70px}.B .split{display:grid;grid-template-columns:70px 1fr;min-height:490px}.B .scene{height:100%;background:#d8e0d1}.B .scene svg{width:270px;position:absolute;right:-90px}.B .scene-label{writing-mode:vertical-rl;left:24px;top:25px;bottom:auto;letter-spacing:8px;color:#405d4b}.B .poem{padding:27px 20px 12px}.B h2{max-width:245px;font-size:23px}.B .verses{font-size:20px;line-height:2.65;letter-spacing:1px;margin:25px 0}.B .guide{border-left:2px solid #baab81;padding-left:10px;max-width:240px}.B .actions{justify-content:flex-start;margin-left:90px;gap:4px}.B .details{margin-left:90px}.B .bottom{background:#f4f1e6}.C{background:#244942;color:#f1f2df}.C .status,.C .apphead{color:#e1e8d9}.C .day{color:#bacfc0}.C .scene{position:absolute;inset:0;height:470px;background:linear-gradient(#23493f,#628573)}.C .scene svg{opacity:.65}.C .scene-label{display:none}.C .poem{margin:96px 20px 0;padding:28px 22px 22px;background:#f6f5e9;color:#253d31;border-radius:5px;text-align:center}.C .poem h2{font-size:21px}.C .guide{margin-top:20px}.C .actions{color:#e0ebdc;margin-top:17px;border-color:#a7b9a54d;position:relative}.C .details{position:relative;color:#d3dfcf}.C .details p{background:#254337}.C .bottom{background:#244942;border-color:#a7b9a54d}.C .bottom span{color:#a9c0b4}.C .bottom .active{color:#f2e4b7}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#1e332e;color:white;padding:8px 13px;border-radius:40px;box-shadow:0 8px 25px #0003;z-index:10;font-size:13px;white-space:nowrap}.switcher button{padding:8px 12px;font-size:20px}.hint{font-size:11px;color:#799083;text-align:center;margin:13px 0}dialog{border:1px solid #b7c7b9;border-radius:15px;max-width:370px;width:90%;padding:25px;background:#f6f6ec;color:#294438;line-height:1.8}dialog::backdrop{background:#132e2966}dialog button{display:block;margin-left:auto;padding:8px 10px;border:1px solid #bdcbbb;border-radius:5px}a{color:#3a6855}footer{font-size:11px;color:#768178;line-height:1.8;margin-top:24px} @media(max-width:780px){main{display:block;padding:0 15px;margin:10px auto 100px}.intro{padding:6px 6px 20px}.intro h1{font-size:26px;margin:10px 0}.intro p{font-size:13px;margin:6px 0}.choices{margin:12px 0}.notes{margin-top:12px;padding-top:12px}.notes ul{display:none}.state{font-size:10px;margin-top:10px}.phone{margin:auto}.intro footer{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media(max-width:780px){main{display:flex;flex-direction:column;gap:18px}main>.intro{order:2}main>section:last-child{order:1;width:100%}.intro h1{font-size:23px}.phone{min-height:740px}.B .split{grid-template-columns:45px 1fr}.B .poem{padding-left:14px;padding-right:12px}.B .verses{font-size:17px;letter-spacing:0}.B .scene-label{left:15px}.B .actions,.B .details{margin-left:60px}.C .poem{margin-left:12px;margin-right:12px;padding-left:14px;padding-right:14px}.verses{font-size:19px;letter-spacing:1px}}
.D{background:#f8f8ee;display:flex;flex-direction:column;isolation:isolate}
.D .scene{position:absolute;top:34px;right:0;width:175px;height:83px;opacity:.40;pointer-events:none;z-index:0;background:transparent;mask-image:linear-gradient(to right,transparent,#000 55%);-webkit-mask-image:linear-gradient(to right,transparent,#000 55%)}
.D .scene svg{mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 65%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 65%,transparent)}
.D .scene-label{display:none}.D .day{position:absolute;left:28px;top:55px;font-size:10px;letter-spacing:2px}.D .apphead{height:83px;align-items:flex-start;padding-top:17px}.D .brand{font-size:25px}
.D .poem{text-align:center;padding-top:28px;padding-bottom:25px}.D .poem h2{font-size:22px;letter-spacing:1px}.D .verses{line-height:2.65;margin:28px 0 23px}.D .guide{color:#718375;font-size:12px}.D .author{font-size:11px}
.D .actions{margin-top:0;border-top:0;gap:16px;padding:0}.D .actions button{border:1px solid #d9dfd0;border-radius:24px;padding:10px 18px}.D .details{border-top:1px solid #dce2d5;padding-top:10px}.D .bottom{margin-top:auto;background:#f8f8ee}
@media(max-width:780px){.D .poem h2{font-size:21px}.D .poem{padding-left:20px;padding-right:20px}.D .verses{font-size:20px;letter-spacing:1px}}
</style></head><body>
<main><section class="intro"><div class="eyebrow">阅读布局实验 · 非正式设计</div><h1 id="title"></h1><p id="desc"></p><div class="choices" id="choices"></div><div class="notes"><strong>这次只比较画面与文字的关系</strong><div id="tradeoff"></div><ul><li>正文始终直接可读，无需先滑过情景封面。</li><li>插画是程序绘制的构图占位，不是历史地点复原。</li><li>不播放声音；按钮只演示开关与收藏状态。</li><li>底部为结构示意，探索和诗集尚未接入。</li></ul></div><pre class="state" id="state"></pre><footer>示例原文：李白《黄鹤楼送孟浩然之广陵》。<br><a href="https://zh.wikisource.org/zh/黃鶴樓送孟浩然之廣陵" target="_blank" rel="noopener">查看原文来源</a> · 引导文字为本原型的编辑表达。</footer></section><section><div class="phone" id="phone"></div><p class="hint">临时 HTML 原型 · 不代表 iOS 实现效果</p></section></main>
<div class="switcher"><button id="prev" aria-label="上一个方案">←</button><span id="current"></span><button id="next" aria-label="下一个方案">→</button></div><dialog id="dialog"><h3>从诗句走向诗人</h3><p>这里将进入李白的诗人页，再展开生平与局部关系星图。当前草案仅比较阅读布局。</p><button id="close">知道了</button></dialog>
<script>
const variants={A:{name:'画面在上',title:'A · 留一扇窗，看见远方',desc:'小幅情景在上，诗句居中。读完画面，视线自然落到正文；整体最接近安静的阅读页。',tradeoff:'建议起点：画面占比小，正文清楚；浪漫感主要依赖画面细节、留白和措辞。'},B:{name:'图文并置',title:'B · 像翻开一本诗选',desc:'窄幅风景沿着页面左侧延伸，标题、诗句和短引导依次左对齐，阅读节奏更像书页。',tradeoff:'文字感更强、复古感更多；窄屏下可用行宽较少，需要特别检查长标题和大字号。'},C:{name:'画面铺底',title:'C · 在暮色里展开一页诗',desc:'风景铺在底层，一块浅色阅读区承载正文。环境感更强，但仍用稳定底色保障文字对比。',tradeoff:'情景更明显；画面容易抢走注意力，需要控制亮度和阅读区位置。它是构图方案，不是自动夜间主题。'}};
variants.D={name:'页边入景',title:'D · 把风景留在页边',desc:'情景只落在页眉一角，边缘淡出；正文保持纯净底色，没有单独的插画区域，也没有叠放的阅读卡片。',tradeoff:'针对你的反馈：减少画面的空间占用，避免图文重叠。情景感会更轻，后续可通过真实素材和少量动效细化。'};
let variant=new URLSearchParams(location.search).get('variant');if(!variants[variant])variant='A';let saved=false,sound=false;
const scene=`<div class="scene" aria-label="山水构图占位"><svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="308" cy="45" r="22" fill="#e9dcc0"/><path d="M0 130L65 80L130 119L185 49L270 118L336 69L410 120V200H0" fill="#8aa495" opacity=".5"/><path d="M0 160L68 110L130 160L220 119L290 163L410 113V220H0" fill="#607e6d" opacity=".4"/><path d="M-20 170Q100 132 230 170T440 171V220H0" fill="#c8d4c2"/><path d="M192 154h24l-5 5h-16z" fill="#526c5b"/><path d="M203 130v24m1-23 9 18h-9" fill="#f2ecd7" stroke="#526c5b" stroke-width="1"/></svg><span class="scene-label">江水 · 远帆</span></div>`;
function poem(){return `<article class="poem"><h2>黄鹤楼送孟浩然之广陵</h2><button class="author" id="author" aria-label="查看李白诗人页示意">唐 · 李白 ↗</button><div class="verses"><span>故人西辞黄鹤楼，</span><span>烟花三月下扬州。</span><span>孤帆远影碧空尽，</span><span>唯见长江天际流。</span></div><p class="guide">船已远去，目光还留在江上。</p></article>`}
function updateState(){document.getElementById('state').textContent=JSON.stringify({方案:variant,页面:'今日／阅读',收藏:saved?'已收藏':'未收藏',声音:sound?'开启示意（无音频）':'关闭',数据:'内存演示，刷新重置'},null,2)}
function render(){let v=variants[variant];document.getElementById('title').textContent=v.title;document.getElementById('desc').textContent=v.desc;document.getElementById('tradeoff').textContent=v.tradeoff;document.getElementById('current').textContent=variant+' · '+v.name;document.getElementById('choices').innerHTML=Object.keys(variants).map(k=>`<button data-variant="${k}" aria-pressed="${k===variant}">${k} ${variants[k].name}</button>`).join('');let phone=document.getElementById('phone');phone.className='phone '+variant;phone.innerHTML=`<div class="status"><span>9:41</span><span>● ● ▰</span></div><header class="apphead"><span class="brand">今日</span><span class="day">每日一首</span></header>`+(variant==='B'?`<div class="split">${scene}${poem()}</div>`:scene+poem())+`<div class="actions"><button id="save" aria-pressed="${saved}">${saved?'已收藏':'＋ 收藏'}</button><button id="sound" aria-pressed="${sound}">${sound?'关闭声音示意':'声音 · 关闭'}</button></div><details class="details"><summary>读懂这一刻 · 展开</summary><p>这里将按需展开背景、译注与来源。短引导是一种阅读感受，不作为写作时间或地点的证据。</p></details><nav class="bottom" aria-label="底部导航结构示意"><span class="active">今日<b></b></span><span>探索</span><span>诗集</span></nav>`;document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>choose(b.dataset.variant));document.getElementById('save').onclick=()=>{saved=!saved;render()};document.getElementById('sound').onclick=()=>{sound=!sound;render()};document.getElementById('author').onclick=()=>document.getElementById('dialog').showModal();updateState()}
function choose(k){variant=k;let url=new URL(location.href);url.searchParams.set('variant',k);history.replaceState({},'',url);render()}
function cycle(d){let keys=Object.keys(variants);choose(keys[(keys.indexOf(variant)+d+keys.length)%keys.length])}document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('close').onclick=()=>document.getElementById('dialog').close();document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable="true"]')||document.getElementById('dialog').open)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});render();
</script></body></html>
