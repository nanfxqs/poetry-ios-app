oke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg></a><div class="poem"><p>故人西辞黄鹤楼，</p><p>烟花三月下扬州。</p><p>孤帆远影碧空尽，</p><p>唯见长江天际流。</p></div><div class="after-poem"><p class="mood">船已远去，目光还留在江上。</p><button class="icon bookmark" aria-label="收藏诗词" aria-pressed="false" data-save=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3Z"></path></svg></button></div><details class="fold"><summary>背景与译注 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p>从黄鹤楼到扬州，诗人的目光追随着远行的帆影。<br>原文来源：《唐诗三百首》；此处为阅读提示。</p></details><section class="related"><div class="related-label">同写送别</div><a href="#">送元二使安西<span>王维</span></a><a href="#">留别王侍御维<span>孟浩然</span></a></section></main><nav class="nav" aria-label="主导航"><a href="today.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v17H5V4Zm3-2v4m8-4v4M5 9h14m-10 4h6"></path></svg><span>今日</span></a><a href="explore.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20ZM16 8l-3 5-5 3 3-5 5-3Z"></path></svg><span>探索</span></a><a href="collection.html" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5C9 3 5 3 2 4v16c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v16"></path></svg><span>诗集</span></a></nav><div class="home" aria-hidden="true"></div><div class="toast" role="status" hidden=""></div></body></html>
